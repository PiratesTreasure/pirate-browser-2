<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirate Browser 2.0</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&family=Inter:wght@300;400;500;600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-base:      #080b10;
  --bg-surface:   #0d1117;
  --bg-panel:     #111820;
  --bg-card:      #161d27;
  --bg-hover:     #1c2535;
  --bg-active:    #1e2d42;
  --border:       #1e2d42;
  --border-light: #253347;
  --text-primary:   #e2e8f0;
  --text-secondary: #7a90a8;
  --text-muted:     #3d5068;
  --accent:       #e8912a;
  --accent-dim:   #7a4a14;
  --accent-glow:  rgba(232,145,42,0.15);
  --green:  #2dd4a0;
  --red:    #f04f5a;
  --blue:   #4a9eff;
  --radius: 6px;
  --titlebar-h: 38px;
  --tabs-h:     48px;
  --toolbar-h:  52px;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 3px; }

/* ── Layout ─────────────────────────────────────────────── */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  width: 100vw;
}

/* ── Titlebar ────────────────────────────────────────────── */
#titlebar {
  display: flex;
  align-items: center;
  height: var(--titlebar-h);
  background: var(--bg-base);
  border-bottom: 1px solid var(--border);
  -webkit-app-region: drag;
  flex-shrink: 0;
  padding: 0 8px 0 14px;
  gap: 10px;
  z-index: 100;
}
.titlebar-logo {
  display: flex; align-items: center; gap: 8px;
  -webkit-app-region: no-drag;
}
.logo-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; letter-spacing: 2px;
  color: var(--accent); line-height: 1;
}
.logo-ver {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--text-muted);
  letter-spacing: 1px;
}
.titlebar-spacer { flex: 1; }
.titlebar-status {
  display: flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--text-muted);
  -webkit-app-region: no-drag;
}
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-muted); transition: background 0.3s;
}
.status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }
.window-controls {
  display: flex; gap: 2px;
  -webkit-app-region: no-drag;
  margin-left: 8px;
}
.wc-btn {
  width: 30px; height: 26px; border: none;
  background: transparent; color: var(--text-secondary);
  cursor: pointer; border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, color 0.15s;
}
.wc-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.wc-btn.close:hover { background: var(--red); color: #fff; }

/* ── Tabs bar ────────────────────────────────────────────── */
#tabs-bar {
  display: flex; align-items: stretch;
  height: var(--tabs-h);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  padding: 0 8px; gap: 3px;
  overflow-x: auto; overflow-y: hidden;
  flex-shrink: 0;
}
#tabs-bar::-webkit-scrollbar { height: 2px; }

.account-tab {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px 0 12px;
  min-width: 140px; max-width: 220px;
  height: 100%; background: transparent; border: none;
  cursor: pointer; color: var(--text-secondary);
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: all 0.15s; white-space: nowrap;
  border-radius: var(--radius) var(--radius) 0 0;
  margin-top: 4px; flex-shrink: 0;
}
.account-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
.account-tab.active { background: var(--bg-panel); color: var(--text-primary); border-bottom-color: var(--accent); }
.account-tab.active .tab-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.tab-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
.tab-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.tab-close {
  width: 16px; height: 16px; border-radius: 50%; border: none;
  background: transparent; color: var(--text-muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; flex-shrink: 0; opacity: 0; transition: all 0.15s;
}
.account-tab:hover .tab-close { opacity: 1; }
.tab-close:hover { background: var(--red); color: #fff; }

#add-tab-btn {
  display: flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; margin: auto 0;
  border: 1px dashed var(--border-light); border-radius: var(--radius);
  background: transparent; color: var(--text-muted);
  cursor: pointer; font-size: 18px; flex-shrink: 0;
  transition: all 0.15s;
}
#add-tab-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

/* ── Bunker fixed tab ────────────────────────────────────── */
#bunker-tab {
  display: flex; align-items: center; gap: 8px;
  padding: 0 16px;
  height: 100%; background: transparent; border: none;
  cursor: pointer; color: var(--text-secondary);
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600;
  border-bottom: 2px solid transparent;
  transition: all 0.15s; white-space: nowrap;
  border-radius: var(--radius) var(--radius) 0 0;
  margin-top: 4px; flex-shrink: 0;
  letter-spacing: 0.5px;
}
#bunker-tab:hover { background: var(--bg-hover); color: #4a9eff; }
#bunker-tab.active { background: var(--bg-panel); color: #4a9eff; border-bottom-color: #4a9eff; }
#bunker-tab.active .bunker-dot { background: #4a9eff; box-shadow: 0 0 6px #4a9eff; }
.bunker-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; transition: all 0.15s; }
.tabs-divider { width: 1px; height: 24px; background: var(--border); margin: auto 4px; flex-shrink: 0; }

/* ── Toolbar ─────────────────────────────────────────────── */
#toolbar {
  display: flex; align-items: center;
  height: var(--toolbar-h);
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  padding: 0 12px; gap: 8px;
  flex-shrink: 0; z-index: 80;
}
.nav-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--border-light); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text-secondary);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.nav-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
.url-bar {
  flex: 1; height: 32px;
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: var(--radius); color: var(--text-primary);
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  padding: 0 12px; outline: none; transition: border-color 0.15s;
}
.url-bar:focus { border-color: var(--accent); }
.url-bar::placeholder { color: var(--text-muted); }
.toolbar-div { width: 1px; height: 24px; background: var(--border); flex-shrink: 0; }
.toolbar-btn {
  display: flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px;
  border: 1px solid var(--border-light); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text-secondary);
  cursor: pointer; font-family: 'Inter', sans-serif;
  font-size: 12px; font-weight: 500;
  transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
}
.toolbar-btn:hover,
.toolbar-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }

/* ── Tools dropdown in toolbar ── */
.tools-drop { position: relative; flex-shrink: 0; }
.tools-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 220px;
  max-height: calc(100vh - 60px);
  overflow-y: auto;
  background: var(--bg-panel);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  z-index: 500;
  display: none;
}
.tools-menu.open { display: block; }
.tools-menu-hdr {
  padding: 7px 12px 5px;
  font-size: 10px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}
.tools-menu-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
  color: var(--text-primary); font-size: 12px;
}
.tools-menu-item:last-child { border-bottom: none; }
.tools-menu-item:hover { background: var(--bg-hover); color: var(--accent); }
.tools-menu-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
}
.tools-menu-sub-hdr {
  padding: 5px 12px 4px;
  font-size: 9px; text-transform: uppercase;
  letter-spacing: 1px; color: var(--text-muted);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--bg-surface);
}
.tools-menu-sub-item {
  display: flex; align-items: center;
  padding: 7px 14px 7px 26px; cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background 0.15s;
  color: var(--text-secondary); font-size: 11px;
}
.tools-menu-sub-item:last-child { border-bottom: none; }
.tools-menu-sub-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.tools-empty {
  padding: 14px; text-align: center;
  color: var(--text-muted); font-size: 11px;
}

/* ── Account info in toolbar ── */
.acct-info {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.acct-chip {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px;
}
.acct-lbl {
  color: var(--text-muted);
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
}
.acct-val { font-weight: 600; font-size: 12px; color: var(--text-primary); }
.acct-val.gold  { color: var(--accent); }
.acct-val.green { color: var(--green); }
.acct-val.blue  { color: var(--blue); }
.acct-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--text-muted); flex-shrink: 0;
}
.acct-dot.online { background: var(--green); box-shadow: 0 0 5px var(--green); }
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 18px; padding: 0 5px;
  background: var(--accent); color: #000;
  font-size: 10px; font-weight: 700; border-radius: 9px;
  font-family: 'JetBrains Mono', monospace;
}

/* ── Webview container ───────────────────────────────────── */
@keyframes pulse-update {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:0.85; transform:scale(1.03); }
}

#webview-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #fff;
}

webview {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: none;
  display: none;
}
webview.active { display: flex; }

/* Loading overlay */
.wv-loading {
  position: absolute;
  inset: 0;
  background: var(--bg-base);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--text-muted);
  z-index: 10;
  pointer-events: none;
  transition: opacity 0.4s;
}
.wv-loading.hidden { opacity: 0; }
.wv-loading svg { opacity: 0.2; }
.wv-loading p { font-size: 14px; }

/* ── Scripts panel ───────────────────────────────────────── */
#scripts-panel {
  position: fixed;
  top: calc(var(--titlebar-h) + var(--tabs-h) + var(--toolbar-h));
  right: 0; bottom: 0;
  width: 320px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 500;
  transform: translateX(100%);
  transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
  box-shadow: -8px 0 32px rgba(0,0,0,0.5);
}
#scripts-panel.open { transform: translateX(0); }

.panel-header {
  display: flex; align-items: center; gap: 8px;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.panel-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px; letter-spacing: 2px; flex: 1;
}
.panel-close {
  width: 28px; height: 28px; border: none;
  background: var(--bg-card); color: var(--text-secondary);
  border-radius: var(--radius); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.panel-close:hover { background: var(--red); color: #fff; }

.panel-toolbar {
  display: flex; gap: 6px; padding: 10px 16px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.panel-btn {
  display: flex; align-items: center; gap: 5px;
  height: 28px; padding: 0 10px;
  border: 1px solid var(--border-light); border-radius: var(--radius);
  background: var(--bg-card); color: var(--text-secondary);
  cursor: pointer; font-size: 11px; font-family: 'Inter', sans-serif;
  font-weight: 500; transition: all 0.15s; white-space: nowrap;
}
.panel-btn:hover             { border-color: var(--accent); color: var(--accent); }
.panel-btn.g:hover           { border-color: var(--green);  color: var(--green);  }
.panel-btn.r:hover           { border-color: var(--red);    color: var(--red);    }

.panel-search { padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.panel-search input {
  width: 100%; height: 30px;
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: var(--radius); color: var(--text-primary);
  font-family: 'Inter', sans-serif; font-size: 12px;
  padding: 0 10px; outline: none; transition: border-color 0.15s;
}
.panel-search input:focus { border-color: var(--accent); }
.panel-search input::placeholder { color: var(--text-muted); }

#scripts-list {
  flex: 1; overflow-y: auto; padding: 8px;
  display: flex; flex-direction: column; gap: 3px;
}

.script-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius);
  border: 1px solid transparent; transition: all 0.15s;
}
.script-item:hover { background: var(--bg-hover); border-color: var(--border); }
.script-item.on { background: var(--bg-active); border-color: var(--border-light); }
.script-item.on .script-name { color: var(--accent); }

.script-info { flex: 1; min-width: 0; }
.script-name {
  font-size: 12px; font-weight: 600; color: var(--text-primary);
  margin-bottom: 3px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}
.script-desc {
  font-size: 11px; color: var(--text-muted); line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.script-ver {
  font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--text-muted); background: var(--bg-card);
  padding: 1px 5px; border-radius: 3px; border: 1px solid var(--border);
  margin-top: 4px; display: inline-block;
}
.script-del {
  width: 20px; height: 20px; border: none;
  background: transparent; color: var(--text-muted);
  cursor: pointer; border-radius: var(--radius);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: all 0.15s; flex-shrink: 0;
}
.script-item:hover .script-del { opacity: 1; }
.script-del:hover { background: var(--red); color: #fff; }

.toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; margin-top: 1px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: 10px; cursor: pointer; transition: all 0.2s;
}
.toggle-slider::before {
  content: ''; position: absolute;
  left: 2px; top: 50%; transform: translateY(-50%);
  width: 14px; height: 14px;
  background: var(--text-muted); border-radius: 50%; transition: all 0.2s;
}
.toggle input:checked + .toggle-slider { background: var(--accent-dim); border-color: var(--accent); }
.toggle input:checked + .toggle-slider::before { left: 18px; background: var(--accent); box-shadow: 0 0 6px var(--accent); }

/* ── Add account modal ───────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.visible { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg-panel); border: 1px solid var(--border-light);
  border-radius: 10px; padding: 24px; width: 360px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  transform: scale(0.95); transition: transform 0.2s;
}
.modal-overlay.visible .modal { transform: scale(1); }
.modal-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 2px; color: var(--accent); margin-bottom: 20px;
}
.modal-label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--text-secondary); text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 6px;
}
.modal-input {
  width: 100%; height: 38px;
  background: var(--bg-card); border: 1px solid var(--border-light);
  border-radius: var(--radius); color: var(--text-primary);
  font-family: 'Inter', sans-serif; font-size: 13px;
  padding: 0 12px; outline: none; margin-bottom: 20px;
  transition: border-color 0.15s;
}
.modal-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.btn-primary {
  height: 36px; padding: 0 20px; background: var(--accent);
  border: none; border-radius: var(--radius); color: #000;
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-ghost {
  height: 36px; padding: 0 16px; background: transparent;
  border: 1px solid var(--border-light); border-radius: var(--radius);
  color: var(--text-secondary); font-family: 'Inter', sans-serif;
  font-size: 13px; cursor: pointer; transition: all 0.15s;
}
.btn-ghost:hover { border-color: var(--text-secondary); color: var(--text-primary); }

/* ── Toast ───────────────────────────────────────────────── */
#toasts {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  z-index: 2000; display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--bg-panel); border: 1px solid var(--border-light);
  border-radius: var(--radius); padding: 10px 16px;
  font-size: 12px; color: var(--text-primary);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  animation: tin 0.25s ease, tout 0.25s ease 2.5s forwards;
  display: flex; align-items: center; gap: 8px; white-space: nowrap;
}
.toast.s { border-color: var(--green); }
.toast.e { border-color: var(--red); }
.toast.i { border-color: var(--accent); }
@keyframes tin  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes tout { from { opacity:1; } to { opacity:0; } }
</style>
</head>
<body>
<div id="app">

  <!-- TITLEBAR -->
  <div id="titlebar">
    <div class="titlebar-logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17h8v-2.26C17.81 13.47 19 11.38 19 9c0-3.87-3.13-7-7-7z" fill="#e8912a"/>
        <circle cx="9" cy="9" r="1.5" fill="#080b10"/>
        <circle cx="15" cy="9" r="1.5" fill="#080b10"/>
        <path d="M9 17v1.5a1.5 1.5 0 003 0V17M12 17v1.5" stroke="#e8912a" stroke-width="1.5"/>
        <path d="M4 20l5-3M20 20l-5-3M8 21h8" stroke="#e8912a" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="logo-text">Pirate Browser</div>
        <div class="logo-ver" id="app-version" onclick="checkForUpdates()" style="cursor:pointer;-webkit-app-region:no-drag;" title="Click to check for updates">v2.0.0</div>
      </div>
    </div>
    <div class="titlebar-spacer"></div>
    <div class="titlebar-status">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">connecting...</span>
    </div>

  <div class="modal">

      onkeydown="if(event.key==='Enter') confirmAdd()">

      <button class="btn-primary" onclick="confirmAdd()">Add Account</button>
    </div>

<!-- TOASTS -->
<div id="toasts"></div>

<script>
'use strict';

const TARGET = 'https://shippingmanager.cc';

// ── State ────────────────────────────────────────────────────
let activeId    = null;
let allScripts  = [];
let filterText  = '';
let panelOpen    = false;
let bunkerActive = false;

// webviews map: accountId → <webview> element
const webviews = new Map();

// Track which webviews are ready
const webviewReady = new Map();

// ── Boot ─────────────────────────────────────────────────────
async function init() {
  document.getElementById('app-version').textContent =
    'v' + await window.pirate.app.version();

  const accounts = await window.pirate.accounts.list();

  for (const acc of accounts) {
    createTab(acc.id, acc.label);
    createWebview(acc.id);
  }

  if (accounts.length > 0) {
    // Wait for first webview dom-ready before switching
    const firstId = accounts[0].id;
    const firstWv = webviews.get(firstId);
    if (firstWv && !webviewReady.get(firstId)) {
      firstWv.addEventListener('dom-ready', () => switchTo(firstId), { once: true });
    } else {
      switchTo(firstId);
    }
  }

  setTimeout(() => setStatus(true), 1500);
}

// ── Webview management ───────────────────────────────────────
function createWebview(id) {
  const partition = `persist:account-${id}`;
  window.pirate.accounts.setupPartition(partition);

  const wv = document.createElement('webview');
  wv.id = `wv-${id}`;
  wv.setAttribute('backgroundthrottling', 'false'); // keep scripts running when minimized
  wv.setAttribute('partition', partition);
  wv.setAttribute('src', TARGET);
  wv.setAttribute('useragent',
    'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ' +
    'AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36');
  wv.setAttribute('allowpopups', 'false');
  wv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:none;display:none;';
  wv._pendingInject = false;

  // Mark ready on dom-ready
  wv.addEventListener('dom-ready', () => {
    webviewReady.set(id, true);
  });

  // Forward webview console logs to main window console
  wv.addEventListener('console-message', (e) => {
    const prefix = '[wv:' + id + '] ';
    if (e.level === 2) console.error(prefix + e.message);
    else if (e.level === 1) console.warn(prefix + e.message);
    else console.log(prefix + e.message);
  });

  // Handle page load - inject scripts if enabled
  wv.addEventListener('did-finish-load', async () => {
    const url = wv.getURL();
    if (id === activeId) {
      document.getElementById('url-bar').value = url;
    }
    setStatus(true);

    // Hide loading overlay
    const overlay = document.getElementById('loading-overlay');
    if (overlay) overlay.classList.add('hidden');

    // Inject enabled scripts (always inject on load, handles both first load and reloads)
    if (url.startsWith(TARGET)) {
      // Prevent double injection if did-finish-load fires multiple times
      if (wv._injecting) return;
      wv._injecting = true;

      // Wait for the page app to fully initialise before injecting
      await new Promise(r => setTimeout(r, 1500));

      // Re-check webview is still valid after the wait
      try { if (!wv.getURL().startsWith(TARGET)) { wv._injecting = false; return; } } catch { wv._injecting = false; return; }

      const scripts = await window.pirate.scripts.getAllEnabled(id);

      // Inject all scripts as a single concatenated block inside the page context
      // This ensures window is shared between all scripts
      const allSrc = scripts.map(s => {
        return `/* === ${s.filename} === */\ntry {\n${s.src}\n} catch(e) { console.error('[PirateBrowser] ${s.filename}:', e.message); }`;
      }).join('\n\n');

      if (allSrc) {
        // Tell this webview if it's the active one (only active webview handles purchases)
        const isActive = id === activeId;
        console.log('[INJECT] Webview ' + id + ' isActive=' + isActive + ' (activeId=' + activeId + ', allWebviews=' + [...webviews.keys()].join(',') + ')');
        try {
          await wv.executeJavaScript(`window.__pirateBrowserIsActive = ${isActive}; window.__pirateBrowserDesktop = true;`);
        } catch (e2) {
          console.error('[inject] isActive', e2.message);
        }

        for (const s of scripts) {
          try {
            await wv.executeJavaScript(s.src);
          } catch (e2) {
            console.error('[inject]', s.filename, e2.message);
          }
        }
      }
      wv._injecting = false;
    }
    wv._pendingInject = false;
  });

  wv.addEventListener('did-start-loading', () => {
    wv._injecting = false; // Reset injection guard on new page load
    if (id === activeId) {
      document.getElementById('url-bar').style.opacity = '0.5';
    }
  });

  wv.addEventListener('did-stop-loading', () => {
    if (id === activeId) {
      document.getElementById('url-bar').style.opacity = '1';
    }
  });

  wv.addEventListener('did-navigate', () => {
    if (id === activeId) {
      let url;
      try { url = wv.getURL(); } catch(e) {}
      if (url) document.getElementById('url-bar').value = url;
      document.getElementById('url-bar').style.opacity = '1';
    }
  });

  wv.addEventListener('new-window', (e) => {
    if (e.url && !e.url.startsWith(TARGET)) {
      window.pirate.shell.openExternal(e.url);
    }
  });

  document.getElementById('webview-container').appendChild(wv);
  webviews.set(id, wv);
  return wv;
}

function switchToBunker() {
  // Hide all account webviews
  for (const wv of webviews.values()) {
    wv.style.display = 'none';
    wv.classList.remove('active');
  }
  // Show bunker
  const bwv = document.getElementById('wv-bunker');
  bwv.style.display = 'flex';
  document.getElementById('url-bar').value = 'https://piratebunker.netlify.app/';
  // Update tabs
  document.querySelectorAll('.account-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('bunker-tab').classList.add('active');
  bunkerActive = true;
  activeId = null;
  // Hide scripts panel - not applicable for bunker
  if (panelOpen) togglePanel();
}

function switchTo(id) {
  // Hide bunker
  const bwv = document.getElementById('wv-bunker');
  if (bwv) bwv.style.display = 'none';
  document.getElementById('bunker-tab').classList.remove('active');
  bunkerActive = false;
  // Hide all account webviews
  for (const [vid, wv] of webviews) {
    wv.style.display = 'none';
    wv.classList.remove('active');
  }
  // Show target
  const wv = webviews.get(id);
  if (wv) {
    wv.style.display = 'flex';
    wv.classList.add('active');
    try {
      const url = wv.getURL();
      document.getElementById('url-bar').value = url || TARGET;
    } catch (e) {
      document.getElementById('url-bar').value = TARGET;
    }
  }
  // Update tabs
  document.querySelectorAll('.account-tab').forEach(t =>
    t.classList.toggle('active', t.dataset.id === id)
  );
  activeId = id;

  // Update active flag on all webviews (only active one handles purchases)
  for (const [vid, w] of webviews) {
    try { w.executeJavaScript(`window.__pirateBrowserIsActive = ${vid === id};`); } catch (e) {}
  }

  // Refresh scripts panel if open
  if (panelOpen) loadScripts(id);
  updateBadge();
}

// ── Tab management ────────────────────────────────────────────
function createTab(id, label) {
  const tab = document.createElement('button');
  tab.className = 'account-tab';
  tab.dataset.id = id;
  tab.innerHTML = `
    <div class="tab-dot"></div>
    <span class="tab-label" title="${label}">${label}</span>
    <button class="tab-close" onclick="removeAccount(event,'${id}')">
      <svg width="8" height="8" viewBox="0 0 8 8">
        <path d="M1 1l6 6M7 1l-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>`;
  tab.onclick = (e) => { if (!e.target.closest('.tab-close')) switchTo(id); };
  tab.addEventListener('dblclick', (e) => {
    if (e.target.closest('.tab-close')) return;
    const n = prompt('Rename account:', label);
    if (n && n.trim()) {
      window.pirate.accounts.rename(id, n.trim());
      tab.querySelector('.tab-label').textContent = n.trim();
    }
  });
  document.getElementById('tabs-bar').insertBefore(
    tab, document.getElementById('add-tab-btn')
  );
}

async function removeAccount(e, id) {
  e.stopPropagation();
  if (!confirm('Remove this account?')) return;
  await window.pirate.accounts.remove(id);
  document.querySelector(`.account-tab[data-id="${id}"]`)?.remove();
  const wv = webviews.get(id);
  if (wv) { wv.remove(); webviews.delete(id); }
  if (activeId === id) {
    const first = document.querySelector('.account-tab');
    if (first) switchTo(first.dataset.id);
  }
  toast('Account removed', 'i');
}

// ── Add Account Modal ─────────────────────────────────────────
function openAddModal() {
  document.getElementById('add-modal').classList.add('visible');
  setTimeout(() => document.getElementById('modal-input').focus(), 50);
}
function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('add-modal').classList.remove('visible');
  document.getElementById('modal-input').value = '';
}
async function confirmAdd() {
  const label = document.getElementById('modal-input').value.trim();
  if (!label) return;
  const acc = await window.pirate.accounts.add(label);
  createTab(acc.id, acc.label);
  createWebview(acc.id);
  switchTo(acc.id);
  document.getElementById('add-modal').classList.remove('visible');
  document.getElementById('modal-input').value = '';
  toast('Account added: ' + label, 's');
}

// ── Navigation ────────────────────────────────────────────────
function navBack()   { webviews.get(activeId)?.goBack(); }
// ── Webview navigation helper ─────────────────────────────────
function wvLoad(wv, url) {
  if (!wv) return;
  try {
    // Try loadURL first (preferred)
    if (typeof wv.loadURL === 'function') {
      wv.loadURL(url);
    } else {
      // Fallback: set src attribute
      wv.src = url;
    }
  } catch (e) {
    console.error('[wvLoad] error:', e.message);
    wv.src = url;
  }
}

function navReload() {
  const wv = webviews.get(activeId);
  if (!wv || !webviewReady.get(activeId)) return;
  let url;
  try { url = wv.getURL(); } catch (e) { url = null; }
  wvLoad(wv, url || TARGET);
}
function reloadWithScripts() {
  if (!activeId) return;
  reloadAndInject(activeId);
  toast('Reloading & injecting scripts...', 'i');
}
function navGo() {
  let url = document.getElementById('url-bar').value.trim();
  if (!url.startsWith('http')) url = 'https://' + url;
  wvLoad(webviews.get(activeId), url);
}

// ── Scripts panel ─────────────────────────────────────────────
function togglePanel() {
  panelOpen = !panelOpen;
  document.getElementById('scripts-panel').classList.toggle('open', panelOpen);
  document.getElementById('scripts-btn').classList.toggle('active', panelOpen);
  if (panelOpen && activeId) loadScripts(activeId);
}

async function loadScripts(accountId) {
  allScripts = await window.pirate.scripts.list(accountId);
  renderScripts(filterText);
  updateBadge();
}

function renderScripts(filter = '') {
  const list = document.getElementById('scripts-list');
  list.innerHTML = '';
  const filtered = filter
    ? allScripts.filter(s =>
        s.name.toLowerCase().includes(filter.toLowerCase()) ||
        s.description.toLowerCase().includes(filter.toLowerCase()))
    : allScripts;

  if (!filtered.length) {
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:12px;">No scripts found</div>';
    return;
  }

  for (const s of filtered) {
    const name = s.name.replace(/^ShippingManager\s*[-–]\s*/i, '');
    const div  = document.createElement('div');
    div.className = 'script-item' + (s.enabled ? ' on' : '');
    div.dataset.fn = s.filename;
    div.innerHTML = `
      <label class="toggle">
        <input type="checkbox" ${s.enabled ? 'checked' : ''}
          onchange="toggleScript('${s.filename}', this.checked)">
        <div class="toggle-slider"></div>
      </label>
      <div class="script-info">
        <div class="script-name">${name}</div>
        <div class="script-desc">${s.description || '—'}</div>
        <span class="script-ver">v${s.version}</span>
      </div>
      <button class="script-del" onclick="removeScript(event,'${s.filename}','${name.replace(/'/g,"\\'")}')">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <path d="M1 1l8 8M9 1l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>`;
    list.appendChild(div);
  }
}

function filterScripts(v) {
  filterText = v;
  renderScripts(v);
}

// ── Reload page then re-inject all enabled scripts ───────────
async function reloadAndInject(accountId) {
  const wv = webviews.get(accountId);
  if (!wv || !webviewReady.get(accountId)) return;
  wv._pendingInject = true;
  let url;
  try { url = wv.getURL(); } catch (e) { url = null; }
  wvLoad(wv, url || TARGET);
}

async function toggleScript(filename, enabled) {
  if (!activeId) return;
  const s = allScripts.find(x => x.filename === filename);
  const name = s ? s.name.replace(/^ShippingManager\s*[-–]\s*/i, '') : filename;

  // Confirm before activating
  if (enabled) {
    const confirmed = await showConfirm(
      `Enable "${name}"?`,
      `This script will activate and the page will reload.`
    );
    if (!confirmed) {
      // Revert the checkbox visually
      const cb = document.querySelector(`.script-item[data-fn="${filename}"] input[type=checkbox]`);
      if (cb) cb.checked = false;
      return;
    }
  }

  await window.pirate.scripts.toggle(activeId, filename, enabled);
  if (s) s.enabled = enabled;
  document.querySelector(`.script-item[data-fn="${filename}"]`)
    ?.classList.toggle('on', enabled);

  await reloadAndInject(activeId);
  updateBadge();
  toast((enabled ? 'Enabled' : 'Disabled') + ': ' + name, enabled ? 's' : 'i');
}

async function enableAll() {
  if (!activeId) return;
  const confirmed = await showConfirm('Enable all scripts?', 'All scripts will activate and the page will reload.');
  if (!confirmed) return;
  await window.pirate.scripts.toggleAll(activeId, true);
  await loadScripts(activeId);
  await reloadAndInject(activeId);
  toast('All scripts enabled', 's');
}

async function disableAll() {
  if (!activeId) return;
  const confirmed = await showConfirm('Disable all scripts?', 'All scripts will be turned off and the page will reload.');
  if (!confirmed) return;
  await window.pirate.scripts.toggleAll(activeId, false);
  await loadScripts(activeId);
  await reloadAndInject(activeId);
  toast('All scripts disabled', 'i');
}

async function addScript() {
  const added = await window.pirate.scripts.add();
  if (added?.length) {
    await loadScripts(activeId);
    toast(`Added ${added.length} script(s)`, 's');
  }
}

async function removeScript(e, filename, name) {
  e.stopPropagation();
  if (!confirm(`Remove "${name}"?\nThis will delete the script file.`)) return;
  await window.pirate.scripts.remove(filename);
  await loadScripts(activeId);
  toast(`Removed: ${name}`, 'i');
}

function updateBadge() {
  const count = allScripts.filter(s => s.enabled).length;
  document.getElementById('enabled-count').textContent = count;
}

// ── Status ────────────────────────────────────────────────────
function setStatus(online) {
  document.getElementById('status-dot').className = 'status-dot' + (online ? ' online' : '');
  document.getElementById('status-text').textContent = online ? 'online' : 'connecting...';
}

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, type = 'i') {
  const icons = { s: '✓', e: '✕', i: '◆' };
  const colors = { s: 'var(--green)', e: 'var(--red)', i: 'var(--accent)' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span style="color:${colors[type]}">${icons[type]}</span> ${msg}`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

// ── Confirm dialog ───────────────────────────────────────────
function showConfirm(title, message) {
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay visible';
    overlay.style.zIndex = '2000';
    overlay.innerHTML = `
      <div class="modal">
        <div class="modal-title" style="font-size:18px">${title}</div>
        <p style="color:var(--text-secondary);font-size:13px;margin-bottom:20px;line-height:1.5">${message}</p>
        <div class="modal-actions">
          <button class="btn-ghost" id="confirm-cancel">Cancel</button>
          <button class="btn-primary" id="confirm-ok">Confirm & Reload</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('#confirm-ok').onclick = () => { overlay.remove(); resolve(true); };
    overlay.querySelector('#confirm-cancel').onclick = () => { overlay.remove(); resolve(false); };
  });
}

// ── Account info polling from webview ────────────────────────
async function pollAccountInfo() {
  if (!activeId) return;
  const wv = webviews.get(activeId);
  if (!wv || !webviewReady.get(activeId)) return;
  try {
    const data = await wv.executeJavaScript(`
      (function() {
        try {
          return {
            username: (document.querySelector('.user-name, .username, .player-name, a[href*="/profile/"]') || {}).textContent?.trim() || null,
            company:  (document.querySelector('.company-name, .company, [data-company]') || {}).textContent?.trim() || null,
            balance:  (document.querySelector('.balance, .money, .cash, [data-balance]') || {}).textContent?.trim() || null,
            rank:     (document.querySelector('.rank, .player-rank, [data-rank]') || {}).textContent?.trim() || null,
          };
        } catch(e) { return null; }
      })()
    `);
    if (!data) return;
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val || '—'; };
    set('acct-user',    data.username);
    set('acct-company', data.company);
    set('acct-balance', data.balance);
    set('acct-rank',    data.rank);
    const dot = document.getElementById('acct-dot');
    if (dot) dot.className = 'acct-dot' + (data.username ? ' online' : '');
  } catch(e) {}
}

setInterval(pollAccountInfo, 3000);

// ── Tools dropdown ───────────────────────────────────────────
let toolsOpen = false;

function toggleToolsMenu() {
  toolsOpen = !toolsOpen;
  document.getElementById('tools-menu').classList.toggle('open', toolsOpen);
  document.getElementById('tools-btn').classList.toggle('active', toolsOpen);
  if (toolsOpen) renderToolsMenu();
}

document.addEventListener('click', (e) => {
  if (!e.target.closest('#tools-drop')) {
    toolsOpen = false;
    document.getElementById('tools-menu')?.classList.remove('open');
    document.getElementById('tools-btn')?.classList.remove('active');
  }
});

function renderToolsMenu() {
  const menu   = document.getElementById('tools-menu');
  const count  = document.getElementById('tools-count');
  const items  = window._pirateMenuItems  || [];
  const subs   = window._pirateSubMenus   || [];
  const total  = items.length + subs.length;

  if (count) count.textContent = total;

  menu.innerHTML = '';

  if (total === 0) {
    menu.innerHTML = '<div class="tools-empty">Enable scripts to see tools here</div>';
    return;
  }

  if (items.length) {
    menu.innerHTML += '<div class="tools-menu-hdr">Script Tools</div>';
    for (const item of items) {
      const el = document.createElement('div');
      el.className = 'tools-menu-item';
      el.innerHTML = `<div class="tools-menu-dot"></div>${item.label}`;
      el.onclick = () => {
        toggleToolsMenu();
        try { item.callback(); } catch(e) { console.error('[Tools]', e); }
      };
      menu.appendChild(el);
    }
  }

  for (const sub of subs) {
    const hdr = document.createElement('div');
    hdr.className = 'tools-menu-sub-hdr';
    hdr.textContent = sub.label;
    menu.appendChild(hdr);
    for (const si of (sub.items || [])) {
      const el = document.createElement('div');
      el.className = 'tools-menu-sub-item';
      el.textContent = si.label || si.name || '';
      const fn = si.fn || si.callback || si.onClick;
      if (fn) el.onclick = () => { toggleToolsMenu(); try { fn(); } catch(e) {} };
      menu.appendChild(el);
    }
  }
}

// Listen for scripts registering new menu items
function setupToolsListener() {
  const wv = webviews.get(activeId);
  if (!wv) return;
  // Poll the webview for registered menu items every 2s
  setInterval(async () => {
    if (!activeId || !webviewReady.get(activeId)) return;
    const wv = webviews.get(activeId);
    if (!wv) return;
    try {
      const data = await wv.executeJavaScript(`
        ({
          items: (window._pirateMenuItems || []).map(i => ({ label: i.label })),
          subs:  (window._pirateSubMenus  || []).map(s => ({
            label: s.label,
            items: (s.items || []).map(i => ({ label: i.label || i.name || '' }))
          }))
        })
      `);
      // Sync into renderer window so renderToolsMenu can use them
      window._pirateMenuItems = data.items.map(i => ({
        label: i.label,
        callback: async () => {
          const wv = webviews.get(activeId);
          if (wv) await wv.executeJavaScript(
            `(window._pirateMenuItems.find(x=>x.label===${JSON.stringify(i.label)})||{callback:()=>{}}).callback()`
          );
        }
      }));
      window._pirateSubMenus = data.subs.map(s => ({
        label: s.label,
        items: s.items.map(si => ({
          label: si.label,
          fn: async () => {
            const wv = webviews.get(activeId);
            if (wv) await wv.executeJavaScript(
              `(function(){var s=(window._pirateSubMenus||[]).find(x=>x.label===${JSON.stringify(s.label)});var i=s&&(s.items||[]).find(x=>(x.label||x.name)===${JSON.stringify(si.label)});var fn=i&&(i.fn||i.callback||i.onClick);if(fn)fn();})()`
            );
          }
        }))
      }));
      const total = data.items.length + data.subs.length;
      const countEl = document.getElementById('tools-count');
      if (countEl) countEl.textContent = total;
    } catch(e) {}
  }, 2000);
}

// ── Start ─────────────────────────────────────────────────────
// F12 opens DevTools for the active webview (to see script console logs)
document.addEventListener('keydown', (e) => {
  if (e.key === 'F12') {
    if (activeId) {
      const wv = webviews.get(activeId);
      if (wv && wv.openDevTools) wv.openDevTools();
    }
  }
});

document.addEventListener('DOMContentLoaded', () => { init(); setTimeout(setupToolsListener, 3000); initUpdater(); });

// ── Auto-updater UI ───────────────────────────────────────────
let updateReady = false;

function initUpdater() {
  if (!window.pirate.updater) return;

  window.pirate.updater.on('updater:update-available', async (info) => {
    // Guard: skip if the "update" version matches the running version
    const currentVer = (await window.pirate.app.version()).replace(/^v/i, '');
    const updateVer  = (info.version || '').replace(/^v/i, '');
    if (currentVer && updateVer && currentVer === updateVer) {
      console.log('[Updater] Ignoring false update — already on v' + currentVer);
      return;
    }
    showUpdateModal(info);
  });

  window.pirate.updater.on('updater:no-update', () => {
    // silently ignore - no notification needed
  });

  window.pirate.updater.on('updater:progress', (progress) => {
    const wrap = document.getElementById('update-progress-wrap');
    const bar  = document.getElementById('update-progress-bar');
    const txt  = document.getElementById('update-progress-text');
    if (wrap) wrap.style.display = 'block';
    if (bar)  bar.style.width = (progress.percent || 0).toFixed(1) + '%';
    if (txt)  txt.textContent = `Downloading... ${(progress.percent || 0).toFixed(0)}%  (${((progress.bytesPerSecond || 0) / 1024 / 1024).toFixed(1)} MB/s)`;
  });

  window.pirate.updater.on('updater:downloaded', (info) => {
    updateReady = true;
    const btn = document.getElementById('update-action-btn');
    if (btn) {
      btn.textContent = '🚀 Restart & Install';
      btn.disabled = false;
      btn.onclick = () => window.pirate.updater.install();
    }
    const txt = document.getElementById('update-progress-text');
    if (txt) txt.textContent = 'Download complete — click to restart and install.';
    const modal = document.getElementById('update-modal');
    if (modal) {
      modal.style.display = 'flex';
      modal.style.opacity = '1';
      modal.style.pointerEvents = 'all';
    }
    const container = document.getElementById('webview-container');
    if (container) container.style.display = 'none';
  });

  window.pirate.updater.on('updater:error', (msg) => {
    console.error('[Updater] Error:', msg);
    const btn = document.getElementById('update-action-btn');
    if (btn) { btn.textContent = 'Retry'; btn.onclick = () => startUpdate(); }
    const notes = document.getElementById('update-notes');
    if (notes) notes.textContent = '⚠ Update error: ' + msg;
  });
}

function showUpdateModal(info) {
  const modal = document.getElementById('update-modal');
  if (!modal) return;

  const ver = document.getElementById('update-version-line');
  if (ver) {
    const current = document.getElementById('app-version')?.textContent || '';
    ver.textContent = current + '  →  v' + info.version;
  }

  // Parse release notes - GitHub releases use markdown
  const notes = document.getElementById('update-notes');
  if (notes) {
    const raw = info.releaseNotes || info.releaseName || 'No patch notes provided.';
    // Strip HTML tags if present, keep line breaks readable
    notes.textContent = typeof raw === 'string'
      ? raw.replace(/<[^>]+>/g, '').trim()
      : JSON.stringify(raw, null, 2);
  }

  // Reset progress
  const wrap = document.getElementById('update-progress-wrap');
  if (wrap) wrap.style.display = 'none';
  const btn = document.getElementById('update-action-btn');
  if (btn) { btn.textContent = 'Download & Install'; btn.onclick = startUpdate; }

  // Don't auto-show modal — just show the titlebar button.
  // User clicks the button to open the modal (avoids hiding webviews on launch).

  // Show persistent button in titlebar
  const updateBtn = document.getElementById('update-btn');
  if (updateBtn) updateBtn.style.display = 'block';
}

function openUpdateModal() {
  const modal = document.getElementById('update-modal');
  if (!modal) return;
  modal.style.display = 'flex';
  modal.style.opacity = '1';
  modal.style.pointerEvents = 'all';
  // Webview tags render in a separate process layer that sits above DOM.
  // We must fully hide the webview container to let the modal show through.
  const container = document.getElementById('webview-container');
  if (container) container.style.display = 'none';
}

function closeUpdateModal(e) {
  if (e && e.target !== document.getElementById('update-modal')) return;
  const modal = document.getElementById('update-modal');
  if (modal) {
    modal.style.display = 'none';
    modal.style.opacity = '0';
    modal.style.pointerEvents = 'none';
  }
  const container = document.getElementById('webview-container');
  if (container) container.style.display = '';
}

async function startUpdate() {
  const btn = document.getElementById('update-action-btn');
  if (btn) { btn.textContent = 'Downloading...'; btn.disabled = true; }
  const result = await window.pirate.updater.download();
  if (result && result.error) {
    if (btn) { btn.textContent = 'Retry'; btn.disabled = false; }
    const notes = document.getElementById('update-notes');
    if (notes) notes.textContent += '\n\n⚠ ' + result.error;
  }
}

// Manual check from settings or menu
async function checkForUpdates() {
  toast('Checking for updates...', 'i');
  const result = await window.pirate.updater.check();
  if (result.noUpdate) toast('You are on the latest version.', 'i');
  else if (result.error) toast('Update check failed: ' + result.error, 'e');
  // update-available event fires automatically if found
}
